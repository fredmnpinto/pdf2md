name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to release (backfill/retry), e.g. v1.0.0"
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Determine release tag
        id: tag
        env:
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          if [[ -n "${INPUT_TAG}" ]]; then
            tag="${INPUT_TAG}"
            if [[ ! "${tag}" =~ ^v[0-9] ]]; then
              echo "error: tag '${tag}' must start with 'v' and a digit (e.g. v1.0.0)" >&2
              exit 1
            fi
            if ! git check-ref-format "refs/tags/${tag}"; then
              echo "error: '${tag}' is not a valid git tag name" >&2
              exit 1
            fi
            echo "Using manually dispatched tag: ${tag}"
            echo "tag=${tag}" >> "${GITHUB_OUTPUT}"
            exit 0
          fi
          tags_output="$(git tag --points-at HEAD --list 'v[0-9]*')"
          if [[ -z "${tags_output}" ]]; then
            echo "no release tag at HEAD; nothing to release"
            exit 0
          fi
          mapfile -t tags <<< "${tags_output}"
          if [[ "${#tags[@]}" -ne 1 ]]; then
            printf 'error: multiple release tags at HEAD: %s\n' "${tags[*]}" >&2
            exit 1
          fi
          echo "Found release tag at HEAD: ${tags[0]}"
          echo "tag=${tags[0]}" >> "${GITHUB_OUTPUT}"

      - name: Create GitHub release
        if: steps.tag.outputs.tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.tag.outputs.tag }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          if gh release view "${TAG}" --repo "${REPO}" >/dev/null 2>&1; then
            echo "Release ${TAG} already exists; nothing to do."
            exit 0
          fi
          args=(--title "${TAG}" --generate-notes --verify-tag --repo "${REPO}")
          core="${TAG%%+*}"
          if [[ "${core}" == *-* ]]; then
            args+=(--prerelease)
          fi
          gh release create "${TAG}" "${args[@]}"
