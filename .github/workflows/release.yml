name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to release (backfill/retry), e.g. v1.0.0"
        required: false
        type: string

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  tag:
    name: Determine release tag
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false

      - name: Determine release tag
        id: tag
        env:
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          if [[ -n "${INPUT_TAG}" ]]; then
            tag="${INPUT_TAG}"
            if [[ ! "${tag}" =~ ^v[0-9] ]]; then
              echo "error: tag '${tag}' must start with 'v' and a digit (e.g. v1.0.0)" >&2
              exit 1
            fi
            if ! git check-ref-format "refs/tags/${tag}"; then
              echo "error: '${tag}' is not a valid git tag name" >&2
              exit 1
            fi
            if ! git rev-parse -q --verify "refs/tags/${tag}" >/dev/null; then
              echo "error: tag '${tag}' does not exist on the remote" >&2
              exit 1
            fi
            echo "Using manually dispatched tag: ${tag}"
            echo "tag=${tag}" >> "${GITHUB_OUTPUT}"
            exit 0
          fi
          tags_output="$(git tag --points-at HEAD --list 'v[0-9]*')"
          if [[ -z "${tags_output}" ]]; then
            echo "no release tag at HEAD; nothing to release"
            exit 0
          fi
          mapfile -t tags <<< "${tags_output}"
          if [[ "${#tags[@]}" -ne 1 ]]; then
            printf 'error: multiple release tags at HEAD: %s\n' "${tags[*]}" >&2
            exit 1
          fi
          echo "Found release tag at HEAD: ${tags[0]}"
          echo "tag=${tags[0]}" >> "${GITHUB_OUTPUT}"

  build:
    name: Build distributions
    needs: tag
    if: needs.tag.outputs.tag != ''
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out the release tag
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.tag.outputs.tag }}
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install build tooling
        run: |
          set -euo pipefail
          python -m pip install --upgrade build twine packaging

      - name: Validate tag version
        env:
          TAG: ${{ needs.tag.outputs.tag }}
          INIT_FILE: src/pdf2md/__init__.py
        run: |
          set -euo pipefail
          if [[ "${TAG}" == *+* ]]; then
            echo "error: tag '${TAG}' uses a local version identifier (+build), which PyPI rejects; cut a new version without '+'" >&2
            exit 1
          fi
          version="${TAG#v}"
          python - "${version}" "${INIT_FILE}" <<'PY'
          import re
          import sys

          from packaging.version import InvalidVersion, Version

          raw, init_path = sys.argv[1:3]
          try:
              parsed = Version(raw)
          except InvalidVersion:
              sys.exit(f"error: tag version '{raw}' is not a valid PEP 440 version")
          if "-" in raw and not parsed.is_prerelease:
              sys.exit(
                  f"error: tag version '{raw}' uses a '-' suffix that is not a PEP 440 pre-release"
              )

          text = open(init_path, encoding="utf-8").read()
          matches = re.findall(r'(?m)^__version__ = "([^"]+)"$', text)
          if len(matches) != 1:
              sys.exit(
                  f"error: expected exactly one __version__ assignment in {init_path}, "
                  f"found {len(matches)}"
              )
          try:
              file_version = Version(matches[0])
          except InvalidVersion:
              sys.exit(
                  f"error: {init_path} version '{matches[0]}' is not a valid PEP 440 version"
              )
          if file_version != parsed:
              sys.exit(
                  f"error: tag version {raw} does not match {init_path} version {matches[0]}"
              )
          print(f"tag version {raw} matches {init_path} version {matches[0]} (PEP 440: {parsed})")
          PY

      - name: Build distributions
        run: |
          set -euo pipefail
          rm -rf dist
          python -m build

      - name: Check distribution metadata
        run: |
          set -euo pipefail
          python -m twine check dist/*

      - name: Upload distributions
        uses: actions/upload-artifact@v5
        with:
          name: python-package-distributions
          path: dist/
          if-no-files-found: error

  release:
    name: Create GitHub release
    needs: [tag, build]
    if: needs.tag.outputs.tag != ''
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.tag.outputs.tag }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          if gh release view "${TAG}" --repo "${REPO}" >/dev/null 2>&1; then
            echo "Release ${TAG} already exists; nothing to do."
            exit 0
          fi
          args=(--title "${TAG}" --generate-notes --verify-tag --repo "${REPO}")
          # The build job rejects '-' suffixes that are not PEP 440 pre-releases,
          # so a '-' here means the GitHub release is a prerelease.
          if [[ "${TAG}" == *-* ]]; then
            args+=(--prerelease)
          fi
          gh release create "${TAG}" "${args[@]}"

  publish:
    name: Publish to PyPI
    needs: [tag, build, release]
    if: needs.tag.outputs.tag != ''
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/pdf2md-cli
    permissions:
      id-token: write
    steps:
      - name: Download distributions
        uses: actions/download-artifact@v6
        with:
          name: python-package-distributions
          path: dist/

      - name: Publish distributions to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          print-hash: true
          skip-existing: true
